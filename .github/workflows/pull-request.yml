name: Pull Request CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # 1. Backend Verification & Test Suite
  # ==========================================
  backend-test:
    name: Backend Build & Test (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven & Run Test Suites
        run: mvn clean verify -B
        working-directory: backend

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  # ==========================================
  # 2. Frontend Validation & Test Suite
  # ==========================================
  frontend-test:
    name: Frontend Build & Test (Node 20 / TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Check & Production Build
        run: npm run build
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm test -- --run
        working-directory: frontend
        continue-on-error: true

  # ==========================================
  # 3. Docker Compose & Configuration Linting
  # ==========================================
  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
